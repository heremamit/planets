<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar System Explorer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #000; color: #e8ecf5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  canvas { display: block; }

  #labels { position: fixed; inset: 0; pointer-events: none; }
  .label { pointer-events: auto; cursor: pointer; font-size: 12px; letter-spacing: .08em;
    text-transform: uppercase; color: #cfd8ea; padding: 2px 8px; border-radius: 10px;
    background: rgba(8, 12, 24, .45); border: 1px solid rgba(255, 255, 255, .12);
    white-space: nowrap; user-select: none; transition: background .2s, color .2s; }
  .label:hover { background: rgba(90, 140, 255, .45); color: #fff; }

  .panel { position: fixed; background: rgba(8, 12, 24, .72); backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, .1); border-radius: 14px; }

  #info { top: 16px; left: 16px; width: 290px; max-width: calc(100vw - 32px); padding: 18px; }
  #info h1 { font-size: 24px; font-weight: 600; margin-bottom: 2px; }
  #info .kind { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #8fa3c8; margin-bottom: 10px; }
  #info p { font-size: 13px; line-height: 1.5; color: #c3cbdc; }
  #info dl { margin-top: 12px; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 12.5px; }
  #info dt { color: #8fa3c8; }
  #info dd { text-align: right; font-variant-numeric: tabular-nums; }

  #enter { margin-top: 14px; width: 100%; background: rgba(109, 155, 255, .22); color: #fff; cursor: pointer;
    border: 1px solid rgba(109, 155, 255, .55); border-radius: 9px; padding: 9px 12px; font-size: 13px; }
  #enter:hover { background: rgba(109, 155, 255, .38); }
  #surface { margin-top: 14px; }
  #surface h2 { font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: #8fa3c8; margin-bottom: 4px; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .45s; z-index: 5; }
  #hud { top: 16px; left: 50%; transform: translateX(-50%); padding: 9px 16px; font-size: 13px; white-space: nowrap;
    max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; display: none; }
  @media (max-width: 720px) { #hud { top: auto; bottom: 130px; } }

  #controls { top: 16px; right: 16px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; font-size: 12px; color: #8fa3c8; }
  #controls input { width: 110px; accent-color: #6d9bff; }
  #controls button { background: rgba(255, 255, 255, .08); color: #e8ecf5; border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
  #controls button:hover { background: rgba(255, 255, 255, .16); }
  #speedVal { min-width: 34px; text-align: right; color: #e8ecf5; font-variant-numeric: tabular-nums; }

  #nav { bottom: 16px; left: 50%; transform: translateX(-50%); max-width: calc(100vw - 32px);
    padding: 8px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  #nav::-webkit-scrollbar { display: none; }
  #nav button { flex: 0 0 auto; display: flex; align-items: center; gap: 7px; background: transparent; color: #c3cbdc;
    border: 1px solid transparent; border-radius: 9px; padding: 8px 12px; font-size: 13px; cursor: pointer;
    transition: background .2s, color .2s; }
  #nav button:hover { background: rgba(255, 255, 255, .08); color: #fff; }
  #nav button.active { background: rgba(109, 155, 255, .22); border-color: rgba(109, 155, 255, .55); color: #fff; }
  #nav .dot { width: 10px; height: 10px; border-radius: 50%; }

  #hint { position: fixed; bottom: 78px; left: 50%; transform: translateX(-50%); font-size: 11.5px;
    color: #7f8cab; white-space: nowrap; pointer-events: none; }
  @media (max-width: 720px) { #hint { display: none; } #controls { top: auto; bottom: 78px; right: 16px; } }
</style>
</head>
<body>

<div id="labels"></div>

<div id="info" class="panel">
  <div class="kind" id="infoKind"></div>
  <h1 id="infoName"></h1>
  <p id="infoText"></p>
  <dl id="infoFacts"></dl>
  <div id="surface"></div>
  <button id="enter">Land on the surface</button>
</div>

<div id="hud" class="panel"></div>
<div id="fade"></div>

<div id="controls" class="panel">
  <button id="pause">Pause</button>
  <span>Speed</span>
  <input id="speed" type="range" min="0" max="10" step="0.1" value="1">
  <span id="speedVal">1.0×</span>
</div>

<div id="hint">Click a planet or its name to travel there · drag to look around · scroll to zoom · ← → next planet · L to land / take off · Esc overview</div>
<div id="nav" class="panel"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ---------------------------------------------------------------------------
// Procedural textures (3D value noise sampled on the sphere, so no seams)
// ---------------------------------------------------------------------------
function hash(x, y, z) {
  const n = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453;
  return n - Math.floor(n);
}
function noise3(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  let xf = x - xi, yf = y - yi, zf = z - zi;
  xf = xf * xf * (3 - 2 * xf); yf = yf * yf * (3 - 2 * yf); zf = zf * zf * (3 - 2 * zf);
  const l = (a, b, t) => a + (b - a) * t;
  return l(
    l(l(hash(xi, yi, zi), hash(xi + 1, yi, zi), xf), l(hash(xi, yi + 1, zi), hash(xi + 1, yi + 1, zi), xf), yf),
    l(l(hash(xi, yi, zi + 1), hash(xi + 1, yi, zi + 1), xf), l(hash(xi, yi + 1, zi + 1), hash(xi + 1, yi + 1, zi + 1), xf), yf),
    zf);
}
function fbm(x, y, z, octaves = 5) {
  let v = 0, amp = 0.5, total = 0;
  for (let i = 0; i < octaves; i++) {
    v += noise3(x, y, z) * amp; total += amp;
    x *= 2.03; y *= 2.03; z *= 2.03; amp *= 0.5;
  }
  return v / total;
}
const hex = h => [(h >> 16) & 255, (h >> 8) & 255, h & 255];
const mix = (a, b, t) => { t = Math.min(1, Math.max(0, t)); return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; };
function ramp(stops, t) {
  t = Math.min(0.9999, Math.max(0, t)) * (stops.length - 1);
  const i = Math.floor(t);
  return mix(stops[i], stops[i + 1], t - i);
}

// shade(x, y, z, u) -> [r, g, b]; (x, y, z) is the point on the unit sphere, u is longitude 0..1
function makeTexture(shade, w = 512, h = 256) {
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(w, h);
  for (let j = 0; j < h; j++) {
    const lat = (0.5 - (j + 0.5) / h) * Math.PI;
    const cl = Math.cos(lat), y = Math.sin(lat);
    for (let i = 0; i < w; i++) {
      const u = (i + 0.5) / w, lon = u * Math.PI * 2;
      const c = shade(cl * Math.cos(lon), y, cl * Math.sin(lon), u);
      const k = (j * w + i) * 4;
      img.data[k] = c[0]; img.data[k + 1] = c[1]; img.data[k + 2] = c[2]; img.data[k + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}

const bands = (stops, turbulence, detail) => (x, y, z) => {
  const t = y * 0.5 + 0.5 + (fbm(x * 2, y * 9, z * 2) - 0.5) * turbulence;
  const c = ramp(stops, t);
  const d = 1 + (fbm(x * 6, y * 30, z * 6, 3) - 0.5) * detail;
  return [c[0] * d, c[1] * d, c[2] * d];
};

const shaders = {
  sun: (x, y, z) => ramp([hex(0xe85d00), hex(0xff9a1a), hex(0xffd65c), hex(0xfff3b0)], fbm(x * 5, y * 5, z * 5) * 1.5 - 0.25),
  mercury: (x, y, z) => {
    const n = fbm(x * 4, y * 4, z * 4), c = fbm(x * 14 + 5, y * 14, z * 14, 3);
    return mix(hex(0x4f4a45), hex(0xb3aaa0), n * 0.8 + c * 0.4 - 0.1);
  },
  venus: (x, y, z) => {
    const s = fbm(x * 2 + y * 2.5, y * 5, z * 2 + y * 2.5);
    return ramp([hex(0xa8742c), hex(0xd9a650), hex(0xf2deab)], s * 1.5 - 0.25);
  },
  earth: (x, y, z) => {
    const h = fbm(x * 2.1 + 3.7, y * 2.1 + 1.3, z * 2.1 + 8.1, 6);
    let c;
    if (h > 0.52) {
      const dry = fbm(x * 5 + 9, y * 5, z * 5, 3) + Math.max(0, 0.35 - Math.abs(y)) * 0.5 - Math.abs(y) * 0.2;
      c = ramp([hex(0x2f6b2d), hex(0x4f8a3a), hex(0xa89a5c), hex(0x8a6f45)], dry * 1.3 - 0.2);
      c = mix(c, hex(0x6b5a48), (h - 0.62) * 6);
    } else {
      c = mix(hex(0x0a2a6b), hex(0x2c7fc2), (h - 0.3) * 4.5);
    }
    const ice = Math.abs(y) + (fbm(x * 6, y * 6, z * 6, 3) - 0.5) * 0.15;
    if (ice > 0.9) c = mix(c, hex(0xf2f6fa), (ice - 0.9) * 25);
    const cloud = fbm(x * 3.2 + 20, y * 5 + 20, z * 3.2 + 20, 5);
    return mix(c, hex(0xffffff), (cloud - 0.54) * 5);
  },
  moon: (x, y, z) => mix(hex(0x55555a), hex(0xc9c9cc), fbm(x * 5, y * 5, z * 5) * 1.2 - 0.1),
  mars: (x, y, z) => {
    const n = fbm(x * 3 + 2, y * 3, z * 3 + 7), d = fbm(x * 1.6 + 11, y * 1.6, z * 1.6);
    let c = ramp([hex(0x7a2f17), hex(0xb5552b), hex(0xdb9360)], n * 1.4 - 0.2);
    c = mix(c, hex(0x4a2618), (d - 0.55) * 5);
    const ice = Math.abs(y) + (fbm(x * 8, y * 8, z * 8, 3) - 0.5) * 0.1;
    return ice > 0.93 ? mix(c, hex(0xf5efe8), (ice - 0.93) * 30) : c;
  },
  jupiter: (() => {
    const A = hex(0xe9d9b8), B = hex(0xa9703f), C = hex(0xc99a66), D = hex(0x8a5a36), E = hex(0xf2e6cf);
    const base = bands([D, C, A, B, E, C, B, A, E, B, C, A, D, C, A, B, D], 0.07, 0.18);
    return (x, y, z, u) => {
      let c = base(x, y, z);
      const dx = (u - 0.3) * Math.PI * 2 / 0.3, dy = (y + 0.38) / 0.11, d = dx * dx + dy * dy;
      if (d < 1) c = mix(c, hex(0xb0452a), (1 - d) * 1.6);
      return c;
    };
  })(),
  saturn: bands([0xb89a62, 0xd9c08a, 0xeedfae, 0xcfb277, 0xe6d39c, 0xf0e2b8, 0xd4b97f, 0xe8d6a2, 0xc9ab70, 0xdcc692, 0xb89a62].map(hex), 0.04, 0.08),
  uranus: bands([0x8fd0d8, 0xa5dde3, 0xb5e6ea, 0xa8dfe5, 0xb9e8ec, 0xa5dde3, 0x8fd0d8].map(hex), 0.03, 0.03),
  neptune: bands([0x1f3fa8, 0x2f58c9, 0x3d6ee0, 0x2a50c0, 0x4a7bea, 0x3160d2, 0x2748b5, 0x1f3fa8].map(hex), 0.08, 0.12),
};

// ---------------------------------------------------------------------------
// Data (sizes and distances are compressed so everything is reachable)
// ---------------------------------------------------------------------------
const BODIES = [

    facts: { Diameter: '4,879 km', Day: '59 Earth days', Year: '88 days', 'From Sun': '57.9 M km', Moons: '0' } },
  { id: 'venus', name: 'Venus', kind: 'Rocky planet', color: '#e0b461', radius: 1.8, dist: 30, period: 0.615, spin: -0.03, tilt: 3,
    text: 'Wrapped in thick clouds of sulphuric acid, Venus is the hottest planet. It spins backwards, and its day is longer than its year.',
    facts: { Diameter: '12,104 km', Day: '243 Earth days', Year: '225 days', 'From Sun': '108.2 M km', Moons: '0' } },
  { id: 'earth', name: 'Earth', kind: 'Rocky planet', color: '#4a90d9', radius: 2, dist: 42, period: 1, spin: 0.5, tilt: 23.4,
    text: 'Home. The only world known to harbour life, with liquid water covering 71% of its surface.',
    facts: { Diameter: '12,742 km', Day: '24 hours', Year: '365.25 days', 'From Sun': '149.6 M km', Moons: '1' } },
  { id: 'mars', name: 'Mars', kind: 'Rocky planet', color: '#c8623a', radius: 1.4, dist: 54, period: 1.881, spin: 0.48, tilt: 25.2,
    text: 'The red planet, coloured by iron oxide dust. It has the tallest volcano in the solar system, Olympus Mons, at about 22 km high.',
    facts: { Diameter: '6,779 km', Day: '24.6 hours', Year: '687 days', 'From Sun': '227.9 M km', Moons: '2' } },
  { id: 'jupiter', name: 'Jupiter', kind: 'Gas giant', color: '#d2a273', radius: 5.5, dist: 80, period: 11.86, spin: 1.1, tilt: 3.1,
    text: 'The largest planet, more than twice as massive as all the others combined. Its Great Red Spot is a storm wider than Earth.',
    facts: { Diameter: '139,820 km', Day: '9.9 hours', Year: '11.9 Earth yr', 'From Sun': '778.5 M km', Moons: '95' } },
  { id: 'saturn', name: 'Saturn', kind: 'Gas giant', color: '#e3cf98', radius: 4.6, dist: 108, period: 29.46, spin: 1.0, tilt: 26.7, rings: true,
    text: 'Famous for its rings of ice and rock, which span 280,000 km yet are mostly only tens of metres thick. Saturn is less dense than water.',
    facts: { Diameter: '116,460 km', Day: '10.7 hours', Year: '29.5 Earth yr', 'From Sun': '1,434 M km', Moons: '274' } },
  { id: 'uranus', name: 'Uranus', kind: 'Ice giant', color: '#a5dde3', radius: 3, dist: 134, period: 84.01, spin: -0.7, tilt: 97.8,
    text: 'An ice giant tipped on its side, rolling around the Sun like a ball. Methane in its atmosphere gives it a pale cyan colour.',
    facts: { Diameter: '50,724 km', Day: '17.2 hours', Year: '84 Earth yr', 'From Sun': '2,871 M km', Moons: '28' } },
  { id: 'neptune', name: 'Neptune', kind: 'Ice giant', color: '#3d6ee0', radius: 2.9, dist: 158, period: 164.8, spin: 0.75, tilt: 28.3,
    text: 'The most distant planet, dark and cold, with the fastest winds in the solar system at over 2,000 km/h.',
    facts: { Diameter: '49,244 km', Day: '16.1 hours', Year: '165 Earth yr', 'From Sun': '4,495 M km', Moons: '16' } },
];
const OVERVIEW = { id: 'overview', name: 'Solar System', kind: 'Overview', color: '#ffffff', radius: 40,
  text: 'Eight planets orbit the Sun. Pick one below, or click it in the scene, to fly there. Sizes and distances are compressed so the trip is short.',
  facts: { Planets: '8', Star: '1', Age: '4.6 billion yr' },
  group: new THREE.Object3D(), offset: new THREE.Vector3(0, 120, 250) };

// What it looks like standing on each world. The giants have no ground, so there you float at the cloud tops.
// sun = apparent size of the Sun relative to Earth's sky; ground = colour ramp from low to high terrain.
const SURFACES = {
  mercury: { sky: 0x000000, hemi: 0x555555, fogNear: 600, fogFar: 3000, stars: 1, sun: 2.6, light: 3.2, amb: 0.25, amp: 14, freq: 0.012, seed: 11,
    ground: [0x2e2b28, 0x5a544e, 0x8a8279, 0xb3aaa0],
    note: 'No air, so the sky is black even at noon and the Sun looks 2.6× wider than from Earth. About 430 °C by day.' },
  venus: { sky: 0xc48a35, fogNear: 5, fogFar: 190, sun: 0, light: 0.9, lightColor: 0xffb060, amb: 1.6, amp: 9, freq: 0.01, seed: 23,
    ground: [0x3d2614, 0x7a4f24, 0xa8743a, 0xc9955a],
    note: '465 °C and 92× Earth\'s air pressure. Thick clouds hide the Sun, so everything is lit a dim orange.' },
  earth: { sky: 0x78b6ee, fog: 0xb5d6f2, fogNear: 60, fogFar: 420, sun: 1, light: 2.6, amb: 1.1, amp: 22, freq: 0.008, seed: 37, water: true,
    ground: [0x8a7f5a, 0xc9b98a, 0x5a9440, 0x3d6b2d, 0x6b5a48, 0xf2f6fa],
    note: 'Blue sky, liquid water and air you can breathe.' },
  mars: { sky: 0xd4a57c, fogNear: 40, fogFar: 400, sun: 0.66, light: 2.2, lightColor: 0xffe2c4, amb: 0.9, amp: 16, freq: 0.009, seed: 41,
    ground: [0x5a2412, 0x9a4a26, 0xc0703f, 0xd99a66],
    note: 'A cold red desert under a thin, dusty butterscotch sky. Gravity is 38% of Earth\'s.' },
  jupiter: { clouds: true, sky: 0x8fa6c4, fog: 0xd9c2a0, fogNear: 20, fogFar: 400, sun: 0.19, light: 2, amb: 1.2, amp: 14, freq: 0.006, seed: 53,
    ground: [0x8a5a36, 0xc99a66, 0xe9d9b8, 0xa9703f, 0xf2e6cf],
    note: 'No solid ground. You float at the top of ammonia clouds, in winds of around 400 km/h.' },
  saturn: { clouds: true, rings: true, sky: 0x56678a, fog: 0xd9c79a, fogNear: 20, fogFar: 400, sun: 0.105, light: 1.8, amb: 1.2, amp: 12, freq: 0.006, seed: 67,
    ground: [0xb89a62, 0xd9c08a, 0xeedfae, 0xcfb277],
    note: 'No solid ground. You float at the cloud tops with the rings arching across the sky.' },
  uranus: { clouds: true, sky: 0x4f9aa8, fog: 0xa5dde3, fogNear: 20, fogFar: 400, sun: 0.052, light: 1.5, amb: 1.3, amp: 8, freq: 0.005, seed: 71,
    ground: [0x8fd0d8, 0xb5e6ea, 0xd6f2f4, 0xa5dde3],
    note: 'No solid ground. A pale methane haze at about −200 °C, with the Sun shrunk to a bright dot.' },
  neptune: { clouds: true, sky: 0x10245f, fog: 0x2f58c9, fogNear: 20, fogFar: 400, stars: 0.5, sun: 0.033, light: 1.3, amb: 1.2, amp: 12, freq: 0.006, seed: 83,
    ground: [0x1f3fa8, 0x3d6ee0, 0x6f9af0, 0x2a50c0],
    note: 'No solid ground. Deep blue methane haze, the fastest winds in the solar system, and sunlight 900× dimmer than on Earth.' },

// ---------------------------------------------------------------------------
// Scene
// ---------------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.prepend(renderer.domElement);

const labelRenderer = new CSS2DRenderer({ element: document.getElementById('labels') });
labelRenderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.05, 6000);
camera.position.copy(OVERVIEW.offset);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.maxDistance = 900;

scene.add(new THREE.AmbientLight(0xffffff, 0.07));
scene.add(new THREE.PointLight(0xfff4e0, 3.2, 0, 0));

// Stars
{
  const n = 6000, pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
  const v = new THREE.Vector3(), c = new THREE.Color();
  for (let i = 0; i < n; i++) {
    v.randomDirection().multiplyScalar(1800 + Math.random() * 1200);
    pos.set([v.x, v.y, v.z], i * 3);
    c.setHSL(Math.random() < 0.5 ? 0.6 : 0.1, 0.5 * Math.random(), 0.55 + Math.random() * 0.45);
    col.set([c.r, c.g, c.b], i * 3);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({ size: 1.6, sizeAttenuation: false, vertexColors: true })));
}

// Asteroid belt between Mars and Jupiter
const belt = (() => {
  const n = 2200, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, r = 62 + Math.random() * 9;
    pos.set([Math.cos(a) * r, (Math.random() - 0.5) * 1.6, Math.sin(a) * r], i * 3);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ color: 0x8a8378, size: 0.22 }));
  scene.add(pts);
  return pts;
})();

function makeRings(inner, outer) {
  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height = 1;
  const ctx = canvas.getContext('2d');
  for (let i = 0; i < 512; i++) {
    const t = i / 511;
    let a = 0.35 + fbm(t * 40, 0, 0, 4) * 0.75;
    if (t > 0.58 && t < 0.64) a *= 0.08;            // Cassini division
    if (t < 0.12) a *= t / 0.12 * 0.6;
    a *= Math.min(1, (1 - t) * 14);
    const c = mix(hex(0xb39b70), hex(0xefe2bd), fbm(t * 18 + 7, 1, 0, 3));
    ctx.fillStyle = `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${Math.min(1, a)})`;
    ctx.fillRect(i, 0, 1, 1);
  }
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  const geo = new THREE.RingGeometry(inner, outer, 160);
  const p = geo.attributes.position, uv = geo.attributes.uv, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {              // remap UVs so the texture runs radially
    v.fromBufferAttribute(p, i);
    uv.setXY(i, (v.length() - inner) / (outer - inner), 0.5);
  }
  const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide, depthWrite: false }));
  mesh.rotation.x = -Math.PI / 2;
  return mesh;
}

const clickable = [];
let moon;
BODIES.forEach((b, i) => {
  b.group = new THREE.Object3D();                  // position on the orbit
  b.axis = new THREE.Object3D();                   // axial tilt
  b.axis.rotation.z = THREE.MathUtils.degToRad(b.tilt);
  b.group.add(b.axis);
  scene.add(b.group);

  const map = makeTexture(shaders[b.id], b.id === 'sun' || b.radius > 4 ? 1024 : 512, b.id === 'sun' || b.radius > 4 ? 512 : 256);
  const mat = b.id === 'sun'
    ? new THREE.MeshBasicMaterial({ map })
    : new THREE.MeshStandardMaterial({ map, roughness: 0.9, metalness: 0 });
  b.mesh = new THREE.Mesh(new THREE.SphereGeometry(b.radius, 64, 48), mat);
  b.mesh.userData.body = b;
  b.axis.add(b.mesh);
  clickable.push(b.mesh);

  if (b.rings) b.axis.add(makeRings(b.radius * 1.3, b.radius * 2.3));

  if (b.id === 'sun') {
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const ctx = c.getContext('2d'), g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
    g.addColorStop(0, 'rgba(255,220,140,1)'); g.addColorStop(0.3, 'rgba(255,170,60,.55)');
    g.addColorStop(0.6, 'rgba(255,120,20,.15)'); g.addColorStop(1, 'rgba(255,100,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, 256, 256);
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), blending: THREE.AdditiveBlending, depthWrite: false }));
    glow.scale.setScalar(b.radius * 5.5);
    b.group.add(glow);
    b.glow = glow;
  }

  if (b.id === 'earth') {
    moon = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 24), new THREE.MeshStandardMaterial({ map: makeTexture(shaders.moon, 256, 128), roughness: 1 }));
    b.group.add(moon);
  }

  if (b.dist) {
    const pts = [];
    for (let k = 0; k < 256; k++) { const a = k / 256 * Math.PI * 2; pts.push(new THREE.Vector3(Math.cos(a) * b.dist, 0, Math.sin(a) * b.dist)); }
    scene.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0x5f78b0, transparent: true, opacity: 0.28 })));
    b.angle = i * 2.4;                             // spread the planets around their orbits
  }

  const el = document.createElement('div');
  el.className = 'label'; el.textContent = b.name;
  el.addEventListener('click', () => flyTo(b));
  b.label = new CSS2DObject(el);
  b.label.position.set(0, b.radius * 1.25 + 0.6, 0);
  b.label.center.set(0.5, 1);
  b.group.add(b.label);
});

// ---------------------------------------------------------------------------
// Travel
// ---------------------------------------------------------------------------
const DESTINATIONS = [OVERVIEW, ...BODIES];
let current = OVERVIEW, flight = null;
const lastPos = new THREE.Vector3(), tmp = new THREE.Vector3();

function viewOffset(b) {
  if (b.offset) return b.offset.clone();
  if (!b.dist) return new THREE.Vector3(0.5, 0.25, 1).normalize().multiplyScalar(b.radius * 4.2);
  // sit on the sunlit side, slightly off-axis and above the orbital plane
  const d = b.group.position.clone().negate().normalize().applyAxisAngle(THREE.Object3D.DEFAULT_UP, 0.75);
  d.y = 0.28;
  return d.normalize().multiplyScalar(b.radius * (b.rings ? 7 : 4.5));
}

function startFlight(offset, dur) {
  flight = { t: 0, dur, fromPos: camera.position.clone(), fromTarget: controls.target.clone(), offset };
  controls.enabled = false;
}

function flyTo(b) {
  if (landed) applyLanded(null);
  if (b === current && !flight) return;
  current = b;
  startFlight(viewOffset(b), 2.4);
  controls.minDistance = b.radius * 1.25;
  showInfo(b);
}

// ---------------------------------------------------------------------------
// Landing: a separate first-person scene standing on the planet
// ---------------------------------------------------------------------------
const surfScene = new THREE.Scene();
surfScene.background = new THREE.Color();
surfScene.fog = new THREE.Fog(0x000000, 10, 400);
const surfCamera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 6000);
surfCamera.rotation.order = 'YXZ';

const SUN_DIR = new THREE.Vector3(0.35, 0.42, -0.84).normalize();
const hemi = new THREE.HemisphereLight(0xffffff, 0x000000, 1);
const sunLight = new THREE.DirectionalLight(0xffffff, 1);
sunLight.position.copy(SUN_DIR);

const TERRAIN = 800, SEG = 220, ROAM = 230;        // terrain size, resolution, and how far you may walk from the centre
const terrain = new THREE.Mesh(new THREE.PlaneGeometry(TERRAIN, TERRAIN, SEG, SEG).rotateX(-Math.PI / 2),
  new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 }));
terrain.geometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array((SEG + 1) ** 2 * 3), 3));
const water = new THREE.Mesh(new THREE.PlaneGeometry(TERRAIN, TERRAIN).rotateX(-Math.PI / 2),
  new THREE.MeshStandardMaterial({ color: 0x1f5f9e, roughness: 0.25, transparent: true, opacity: 0.88 }));
const skySun = new THREE.Sprite(new THREE.SpriteMaterial({ map: BODIES[0].glow.material.map, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
const skyStars = (() => {
  const n = 2500, pos = new Float32Array(n * 3), v = new THREE.Vector3();
  for (let i = 0; i < n; i++) { v.randomDirection().multiplyScalar(4000); pos.set([v.x, Math.abs(v.y), v.z], i * 3); }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  return new THREE.Points(geo, new THREE.PointsMaterial({ size: 1.6, sizeAttenuation: false, transparent: true, fog: false }));
})();
// Saturn's rings seen from the cloud tops: centred on the planet's centre far below, tilted by our latitude
const skyRings = new THREE.Group();
{
  const r = makeRings(1950, 3450);
  r.material.fog = false;
  skyRings.add(r);
  skyRings.rotation.x = 1.05;
}
surfScene.add(hemi, sunLight, terrain, water, skySun, skyStars, skyRings);

let landed = null, fading = false, surf = null, waterY = 0;
const player = { x: 0, y: 0, z: 0, yaw: 0, pitch: 0 }, keys = new Set();

function heightAt(x, z) {
  return (fbm(x * surf.freq + surf.seed, surf.seed, z * surf.freq, surf.clouds ? 3 : 6) - 0.5) * 2 * surf.amp;
}

function buildSurface(b) {
  surf = SURFACES[b.id];
  const pos = terrain.geometry.attributes.position, col = terrain.geometry.attributes.color;
  const stops = surf.ground.map(hex), c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i), h = heightAt(x, z);
    pos.setY(i, h);
    // clouds get long streaky bands; ground is coloured by height
    const t = surf.clouds ? fbm(x * 0.003, 3.3, z * 0.02 + surf.seed, 4) * 1.6 - 0.3 : h / surf.amp * 1.6 + 0.5;
    const rgb = ramp(stops, t), g = (0.88 + hash(x, 1.7, z) * 0.24) / 255;
    c.setRGB(rgb[0] * g, rgb[1] * g, rgb[2] * g, THREE.SRGBColorSpace);
    col.setXYZ(i, c.r, c.g, c.b);
  }
  pos.needsUpdate = col.needsUpdate = true;
  terrain.geometry.computeVertexNormals();

  surfScene.background.set(surf.sky);
  surfScene.fog.color.set(surf.fog ?? surf.sky);
  surfScene.fog.near = surf.fogNear; surfScene.fog.far = surf.fogFar;
  hemi.color.set(surf.hemi ?? surf.sky); hemi.groundColor.set(surf.ground[1]); hemi.intensity = surf.amb;
  sunLight.color.set(surf.lightColor ?? 0xffffff); sunLight.intensity = surf.light;
  waterY = -0.12 * surf.amp;
  water.visible = !!surf.water; water.position.y = waterY;
  skySun.visible = surf.sun > 0; skySun.scale.setScalar(Math.max(40, 420 * surf.sun));
  skyStars.visible = !!surf.stars; skyStars.material.opacity = surf.stars ?? 0;
  skyRings.visible = !!surf.rings;

  // start on dry land, facing the Sun
  let x = 0;
  while (surf.water && x < 200 && heightAt(x, 0) < waterY + 1.5) x += 8;
  Object.assign(player, { x, z: 0, yaw: 0, pitch: 0.08, y: null });
}

function updateSurface(dt) {
  const v = (surf.clouds ? 30 : 12) * (keys.has('shift') ? 3 : 1) * dt;
  const fwd = (keys.has('w') || keys.has('arrowup') ? 1 : 0) - (keys.has('s') || keys.has('arrowdown') ? 1 : 0);
  const side = (keys.has('d') || keys.has('arrowright') ? 1 : 0) - (keys.has('a') || keys.has('arrowleft') ? 1 : 0);
  const sin = Math.sin(player.yaw), cos = Math.cos(player.yaw);
  player.x = THREE.MathUtils.clamp(player.x + (-sin * fwd + cos * side) * v, -ROAM, ROAM);
  player.z = THREE.MathUtils.clamp(player.z + (-cos * fwd - sin * side) * v, -ROAM, ROAM);
  let ground = heightAt(player.x, player.z);
  if (surf.water) ground = Math.max(ground, waterY);
  const y = ground + (surf.clouds ? 9 : 1.8);
  player.y = player.y === null ? y : player.y + (y - player.y) * Math.min(1, dt * 10);

  surfCamera.position.set(player.x, player.y, player.z);
  surfCamera.rotation.set(player.pitch, player.yaw, 0);
  // sky objects stay infinitely far away
  skySun.position.copy(surfCamera.position).addScaledVector(SUN_DIR, 3000);
  skyStars.position.copy(surfCamera.position);
  skyRings.position.set(player.x, player.y - 1500, player.z);
}

function applyLanded(b) {
  landed = b;
  if (b) buildSurface(b);
  keys.clear();
  document.getElementById('labels').style.display = b ? 'none' : '';
  controls.enabled = !b && !flight;
  const hud = document.getElementById('hud');
  hud.style.display = b ? 'block' : 'none';
  if (b) hud.textContent = `${surf.clouds ? 'Floating above' : 'Standing on'} ${b.name} · drag to look · WASD or arrow keys to move · Shift to go faster · L to take off`;
  updateLandButton();
}

function toggleLand() {
  if (!SURFACES[current.id] || flight || fading) return;
  fading = true;
  document.getElementById('fade').style.opacity = 1;
  setTimeout(() => {
    applyLanded(landed ? null : current);
    document.getElementById('fade').style.opacity = 0;
    fading = false;
  }, 450);
}

function updateLandButton() {
  const btn = document.getElementById('enter'), s = SURFACES[current.id];
  btn.style.display = s ? '' : 'none';
  btn.textContent = landed ? 'Take off' : s?.clouds ? 'Descend to the cloud tops' : 'Land on the surface';
}
document.getElementById('enter').addEventListener('click', toggleLand);

// Look around by dragging while landed
let looking = false;
renderer.domElement.addEventListener('pointerdown', () => { looking = true; });
window.addEventListener('pointerup', () => { looking = false; });
window.addEventListener('blur', () => keys.clear());
window.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
renderer.domElement.addEventListener('pointermove', e => {
  if (!landed || !looking) return;
  player.yaw += e.movementX * 0.004;
  player.pitch = THREE.MathUtils.clamp(player.pitch + e.movementY * 0.004, -1.3, 1.3);
});


function showInfo(b) {
  document.getElementById('infoKind').textContent = b.kind;
  document.getElementById('infoName').textContent = b.name;
  document.getElementById('infoText').textContent = b.text;
  document.getElementById('infoFacts').innerHTML = Object.entries(b.facts).map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
  const s = SURFACES[b.id];
  document.getElementById('surface').innerHTML = s ? `<h2>${s.clouds ? 'At the cloud tops' : 'On the surface'}</h2><p>${s.note}</p>` : '';
  updateLandButton();
  for (const btn of nav.children) btn.classList.toggle('active', btn.dataset.id === b.id);
  nav.querySelector('.active')?.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
}

const nav = document.getElementById('nav');
DESTINATIONS.forEach(b => {
  const btn = document.createElement('button');
  btn.dataset.id = b.id;
  btn.innerHTML = `<span class="dot" style="background:${b.color}"></span>${b === OVERVIEW ? 'Overview' : b.name}`;
  btn.addEventListener('click', () => flyTo(b));
  nav.appendChild(btn);
});
showInfo(OVERVIEW);

// Click a planet in the scene (ignore drags)
const raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (landed || !downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return;
  pointer.set(e.clientX / window.innerWidth * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(clickable)[0];
  if (hit) flyTo(hit.object.userData.body);
});
renderer.domElement.addEventListener('pointermove', e => {
  if (landed) return;
  pointer.set(e.clientX / window.innerWidth * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  renderer.domElement.style.cursor = raycaster.intersectObjects(clickable).length ? 'pointer' : 'grab';
});

// Time controls + keyboard
let speed = 1, paused = false;
const speedEl = document.getElementById('speed'), speedVal = document.getElementById('speedVal'), pauseEl = document.getElementById('pause');
speedEl.addEventListener('input', () => { speed = +speedEl.value; speedVal.textContent = speed.toFixed(1) + '×'; });
const togglePause = () => { paused = !paused; pauseEl.textContent = paused ? 'Play' : 'Pause'; };
pauseEl.addEventListener('click', togglePause);

window.addEventListener('keydown', e => {
  if (e.target instanceof HTMLInputElement) return;
  const i = DESTINATIONS.indexOf(current), n = DESTINATIONS.length;
  if (e.key === 'l' || e.key === 'L') toggleLand();
  else if (landed) {                               // on the ground the movement keys walk instead of switching planet
    if (e.key === 'Escape') toggleLand();
    else { keys.add(e.key.toLowerCase()); if (e.key.startsWith('Arrow') || e.key === ' ') e.preventDefault(); }
  }
  else if (e.key === 'ArrowRight') flyTo(DESTINATIONS[(i + 1) % n]);
  else if (e.key === 'ArrowLeft') flyTo(DESTINATIONS[(i - 1 + n) % n]);
  else if (e.key === 'Escape' || e.key === '0') flyTo(OVERVIEW);
  else if (e.key >= '1' && e.key <= '9') flyTo(BODIES[+e.key - 1]);
  else if (e.key === ' ') { e.preventDefault(); togglePause(); }
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  surfCamera.aspect = camera.aspect;
  surfCamera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------------------------------------------------------------------------
// Loop
// ---------------------------------------------------------------------------
const clock = new THREE.Clock();
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
let moonAngle = 0;

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1), sim = paused ? 0 : dt * speed;

  for (const b of BODIES) {
    b.mesh.rotation.y += b.spin * sim;
    if (b.dist) {
      b.angle += 0.25 / b.period * sim;
      b.group.position.set(Math.cos(b.angle) * b.dist, 0, -Math.sin(b.angle) * b.dist);
    }
  }
  moonAngle += 1.6 * sim;
  moon.position.set(Math.cos(moonAngle) * 4.2, 0.3, -Math.sin(moonAngle) * 4.2);
  belt.rotation.y += 0.02 * sim;

  const p = current.group.position;
  if (flight) {
    flight.t = Math.min(1, flight.t + dt / flight.dur);
    const k = ease(flight.t);
    camera.position.lerpVectors(flight.fromPos, tmp.copy(p).add(flight.offset), k);
    controls.target.lerpVectors(flight.fromTarget, p, k);
    camera.lookAt(controls.target);
    if (flight.t === 1) { flight = null; controls.enabled = true; lastPos.copy(p); }
  } else {
    // ride along with the planet so the user can still orbit and zoom around it
    tmp.copy(p).sub(lastPos);
    camera.position.add(tmp);
    controls.target.add(tmp);
    lastPos.copy(p);
    controls.update();
  }


  if (landed) {
    updateSurface(dt);
    renderer.render(surfScene, surfCamera);
  } else {
    renderer.render(scene, camera);
    labelRenderer.render(scene, camera);
  }
});
</script>
</body>
</html>
